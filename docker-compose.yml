services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learnlang_app
    restart: unless-stopped
    depends_on:
      - 9router
    ports:
      # Bind ke localhost internal saja untuk di-reverse proxy oleh Nginx aaPanel
      - "127.0.0.1:${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-mysql://learnlangdb:YYdMBeZ8HbSCE6eP@host.docker.internal:3306/learnlangdb}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://learnlang.web.id}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-supersecretkey_please_change_in_production_123456789}
      AI_PROVIDER: ${AI_PROVIDER:-9router}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://9router:20128/v1}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_MODEL: ${NINEROUTER_MODEL:-antigravity/gemini-3.5-flash-high}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - learnlang_network

  9router:
    image: ${NINEROUTER_IMAGE:-ghcr.io/decolua/9router:0.5.112}
    container_name: learnlang_9router
    restart: unless-stopped
    environment:
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:-Admin12345!@#}
    ports:
      # Bind ke localhost internal (bisa diakses via SSH tunnel atau reverse proxy aaPanel jika ingin dashboard)
      - "127.0.0.1:${NINEROUTER_PORT:-20128}:20128"
    volumes:
      - ninerouter_data:/data
    networks:
      - learnlang_network

volumes:
  uploads_data:
  ninerouter_data:

networks:
  learnlang_network:
    driver: bridge
